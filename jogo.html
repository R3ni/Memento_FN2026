<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MEMENTO — Jogo</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="screen">

        <h1 class="game-title">
            MEMENTO
        </h1>


        <!-- DISPLAY -->

        <div
            id="numero-display"
            class="display"
        >
            1
        </div>


        <!-- BOTÕES -->

        <div class="buttons">

            <button class="number-button">
                1
            </button>

            <button class="number-button">
                2
            </button>

            <button class="number-button">
                3
            </button>

            <button class="number-button">
                4
            </button>

        </div>


        <!-- INFORMAÇÕES DO JOGO -->

        <div class="game-info">

            <span id="fase">
                Fase: 1/5
            </span>

            <span id="timer">
                Tempo: 01:30
            </span>

            <span id="erros">
                Erros: 0/3
            </span>

        </div>


    </main>


    <!-- JAVASCRIPT -->

    <script src="js/jogo.js"></script>

</body>

</html>
